name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # GitHub Packages accepts the workflow token for publish and for the version lookup.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # A merged PR already emits a push to main; one trigger avoids duplicate releases.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for version comparison
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@spottoai'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run contract tests
        run: npm test

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine release version
        id: version-bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" == *"-"* ]]; then
            echo "::error::Prerelease versions are no longer published. Set a stable version (e.g. 1.2.0) in package.json."
            exit 1
          fi

          # A version already in GitHub Packages gets a patch bump. A version that is not there yet
          # (a manually set minor/major baseline such as 1.1.0 or 2.0.0) is published as-is.
          PUBLISHED=$(npm view "@spottoai/types-package@${CURRENT_VERSION}" version 2>/dev/null || true)
          if [[ "$PUBLISHED" == "$CURRENT_VERSION" ]]; then
            NEW_VERSION=$(npm version patch --no-git-tag-version)
            # Commit locally first so the published package records this exact git head.
            git add package.json package-lock.json
            git commit -m "chore: release $NEW_VERSION [skip ci]"
          else
            NEW_VERSION="v${CURRENT_VERSION}"
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version commit
        run: git push origin HEAD:main

      - name: Publish to GitHub Packages
        # Registry comes from publishConfig in package.json.
        run: npm publish --tag latest

      - name: Create Git tag
        run: |
          git tag ${{ steps.version-bump.outputs.new_version }}
          git push origin ${{ steps.version-bump.outputs.new_version }}

      - name: Summary
        run: |
          echo "Published @spottoai/types-package ${{ steps.version-bump.outputs.new_version }} to GitHub Packages"
