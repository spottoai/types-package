name: Backfill Version from npmjs

# One-off helper for the move from registry.npmjs.org to GitHub Packages.
# Copies a version that was already published publicly on npmjs into GitHub Packages, so a
# consumer still pinned to a pre-1.1.0 version keeps installing: cloud-engine-aws (1.0.2-beta.319)
# and spotto-mcp (1.0.2-beta.132, plus 1.0.2-beta.405 through its npm alias). Uses the "legacy" dist-tag so "latest" is not moved. Run after 1.1.0 is published.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated versions to copy from npmjs'
        required: true
        type: string
        default: '1.0.2-beta.319 1.0.2-beta.132 1.0.2-beta.405'

permissions:
  contents: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSIONS: ${{ inputs.versions }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@spottoai'

      - name: Copy versions to GitHub Packages
        run: |
          for VERSION in $VERSIONS; do
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Not a semver version: $VERSION"
              exit 1
            fi
            if [[ "$(npm view "@spottoai/types-package@${VERSION}" version 2>/dev/null || true)" == "$VERSION" ]]; then
              echo "$VERSION is already in GitHub Packages, skipping"
              continue
            fi
            curl -fsSL -o "package-${VERSION}.tgz" "https://registry.npmjs.org/@spottoai/types-package/-/types-package-${VERSION}.tgz"
            npm publish "./package-${VERSION}.tgz" --tag legacy --ignore-scripts
            echo "Copied $VERSION"
          done
