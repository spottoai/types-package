name: Backfill Version from npmjs

# One-off helper for the move from registry.npmjs.org to GitHub Packages.
# Copies a version that was already published publicly on npmjs into GitHub Packages, so a
# consumer still pinned to a pre-1.1.0 version (cloud-engine-aws on 1.0.2-beta.319) keeps
# installing. Uses the "legacy" dist-tag so "latest" is not moved. Run after 1.1.0 is published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to copy from npmjs, e.g. 1.0.2-beta.319'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@spottoai'

      - name: Validate version input
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a semver version: $VERSION"
            exit 1
          fi

      - name: Download tarball from npmjs
        run: curl -fsSL -o package.tgz "https://registry.npmjs.org/@spottoai/types-package/-/types-package-${VERSION}.tgz"

      - name: Publish to GitHub Packages
        run: npm publish ./package.tgz --tag legacy --ignore-scripts
